name: Branch Regression Test

on:
  push:
    branches:
      - agent/stock-localization-format
    paths:
      - .github/workflows/branch-regression-test.yml

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
