name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: BZLocalizationTool.exe
          - os: ubuntu-latest
            artifact_name: BZLocalizationTool
          - os: macos-latest
            artifact_name: BZLocalizationTool

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Windows version metadata
        if: matrix.os == 'windows-latest'
        run: python branding/make_windows_version_info.py

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --noconsole --name BZLocalizationTool --icon branding/app_icon.ico --version-file branding/windows_version_info.txt --add-data "BZONE.ttf;." --add-data "branding/app_icon.ico;branding" --add-data "branding/app_icon.png;branding" --runtime-hook branding/pyinstaller_icon_hook.py localization.py

      - name: Build with PyInstaller (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --noconsole --name BZLocalizationTool --icon branding/app_icon.ico --add-data "BZONE.ttf:." --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" localization.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare Assets
        run: |
          mkdir release_assets
          cp artifacts/windows-latest-artifact/BZLocalizationTool.exe release_assets/BZLocalizationTool.exe || true
          cp artifacts/ubuntu-latest-artifact/BZLocalizationTool release_assets/BZLocalizationTool_Linux || true
          cp artifacts/macos-latest-artifact/BZLocalizationTool release_assets/BZLocalizationTool_macOS || true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
