name: Build and Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: localization-tool-auto-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve next patch version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)"

          if [[ -n "$latest_tag" ]]; then
            current="${latest_tag#v}"
          else
            current="$(tr -d '[:space:]' < VERSION)"
          fi

          IFS='.' read -r major minor patch <<< "$current"

          if [[ -z "${major:-}" || -z "${minor:-}" || -z "${patch:-}" ]]; then
            echo "::error::Could not parse semantic version from '$current'"
            exit 1
          fi

          version="${major}.${minor}.$((patch + 1))"
          tag="v${version}"

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "::error::Release tag $tag already exists"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Next release: $tag"

  build:
    needs: prepare
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: BZLocalizationTool.exe
          - os: ubuntu-latest
            artifact_name: BZLocalizationTool
          - os: macos-latest
            artifact_name: BZLocalizationTool

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Generate Windows version metadata
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_REF_NAME: ${{ needs.prepare.outputs.version }}
        run: python branding/make_windows_version_info.py

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --noconsole --name BZLocalizationTool --icon branding/app_icon.ico --version-file branding/windows_version_info.txt --add-data "BZONE.ttf;." --add-data "branding/app_icon.ico;branding" --add-data "branding/app_icon.png;branding" --runtime-hook branding/pyinstaller_icon_hook.py localization.py

      - name: Build with PyInstaller (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --noconsole --name BZLocalizationTool --icon branding/app_icon.ico --add-data "BZONE.ttf:." --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" localization.py

      # Auto-releases are built from main before the release tag is created.
      # If SignPath is enabled, sign that Windows release artifact before publishing.
      - name: Upload unsigned Windows artifact for SignPath
        id: upload-unsigned-windows
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-unsigned
          path: dist/BZLocalizationTool.exe

      - name: Submit Windows release to SignPath
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-windows.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed Windows artifact
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-artifact
          path: signed/BZLocalizationTool.exe

      - name: Upload unsigned Windows artifact
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-artifact
          path: dist/BZLocalizationTool.exe

      - name: Upload non-Windows artifact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare versioned release archives
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release_assets/windows release_assets/linux release_assets/macos

          cp artifacts/windows-latest-artifact/BZLocalizationTool.exe release_assets/windows/BZLocalizationTool.exe
          cp artifacts/ubuntu-latest-artifact/BZLocalizationTool release_assets/linux/BZLocalizationTool
          cp artifacts/macos-latest-artifact/BZLocalizationTool release_assets/macos/BZLocalizationTool

          chmod +x release_assets/linux/BZLocalizationTool release_assets/macos/BZLocalizationTool

          (cd release_assets/windows && zip -q ../Battlezone98Redux_LocalizationTool-${RELEASE_TAG}-windows.zip BZLocalizationTool.exe)
          (cd release_assets/linux && tar -czf ../Battlezone98Redux_LocalizationTool-${RELEASE_TAG}-linux.tar.gz BZLocalizationTool)
          (cd release_assets/macos && tar -czf ../Battlezone98Redux_LocalizationTool-${RELEASE_TAG}-macos.tar.gz BZLocalizationTool)

          ls -lh release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            release_assets/Battlezone98Redux_LocalizationTool-v*-windows.zip
            release_assets/Battlezone98Redux_LocalizationTool-v*-linux.tar.gz
            release_assets/Battlezone98Redux_LocalizationTool-v*-macos.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
