name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        include:
          - os: windows-latest
            artifact_name: BZLocalizationTool.exe
          - os: ubuntu-latest
            artifact_name: BZLocalizationTool
          - os: macos-latest
            artifact_name: BZLocalizationTool

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Generate Windows version metadata
        if: matrix.os == 'windows-latest'
        run: python branding/make_windows_version_info.py

      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --onefile --noconsole --name BZLocalizationTool --icon branding/app_icon.ico --version-file branding/windows_version_info.txt --add-data "BZONE.ttf;." --add-data "branding/app_icon.ico;branding" --add-data "branding/app_icon.png;branding" --runtime-hook branding/pyinstaller_icon_hook.py localization.py

      - name: Build with PyInstaller (Non-Windows)
        if: matrix.os != 'windows-latest'
        run: |
          pyinstaller --onefile --noconsole --name BZLocalizationTool --icon branding/app_icon.ico --add-data "BZONE.ttf:." --add-data "branding/app_icon.ico:branding" --add-data "branding/app_icon.png:branding" localization.py

      # SignPath Foundation signing is intentionally limited to tagged releases.
      # Until SIGNPATH_ENABLED is set to true, Windows builds continue to publish unsigned.
      - name: Upload unsigned Windows artifact for SignPath
        id: upload-unsigned-windows
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-unsigned
          path: dist/BZLocalizationTool.exe

      - name: Submit Windows release to SignPath
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned-windows.outputs.artifact-id }}'
          wait-for-completion: true
          output-artifact-directory: signed

      - name: Upload signed Windows artifact
        if: matrix.os == 'windows-latest' && vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-artifact
          path: signed/BZLocalizationTool.exe

      - name: Upload unsigned Windows artifact
        if: matrix.os == 'windows-latest' && !(vars.SIGNPATH_ENABLED == 'true' && startsWith(github.ref, 'refs/tags/v'))
        uses: actions/upload-artifact@v4
        with:
          name: windows-latest-artifact
          path: dist/BZLocalizationTool.exe

      - name: Upload non-Windows artifact
        if: matrix.os != 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}-artifact
          path: dist/${{ matrix.artifact_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare versioned release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release_assets/windows release_assets/linux release_assets/macos

          cp artifacts/windows-latest-artifact/BZLocalizationTool.exe release_assets/windows/BZLocalizationTool.exe
          cp artifacts/ubuntu-latest-artifact/BZLocalizationTool release_assets/linux/BZLocalizationTool
          cp artifacts/macos-latest-artifact/BZLocalizationTool release_assets/macos/BZLocalizationTool

          chmod +x release_assets/linux/BZLocalizationTool release_assets/macos/BZLocalizationTool

          (cd release_assets/windows && zip -q ../Battlezone98Redux_LocalizationTool-${GITHUB_REF_NAME}-windows.zip BZLocalizationTool.exe)
          (cd release_assets/linux && tar -czf ../Battlezone98Redux_LocalizationTool-${GITHUB_REF_NAME}-linux.tar.gz BZLocalizationTool)
          (cd release_assets/macos && tar -czf ../Battlezone98Redux_LocalizationTool-${GITHUB_REF_NAME}-macos.tar.gz BZLocalizationTool)

          ls -lh release_assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/Battlezone98Redux_LocalizationTool-v*-windows.zip
            release_assets/Battlezone98Redux_LocalizationTool-v*-linux.tar.gz
            release_assets/Battlezone98Redux_LocalizationTool-v*-macos.tar.gz
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
